services:
  node-1:
    build: .
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    ports:
      - "2222:22"
    tty: true
    stop_signal: SIGRTMIN+3

  node-2:
    build: .
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    ports:
      - "2223:22"
    tty: true
    stop_signal: SIGRTMIN+3

  node-3:
    build: .
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    ports:
      - "2224:22"
    tty: true
    stop_signal: SIGRTMIN+3
