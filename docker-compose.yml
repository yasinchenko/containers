services:
  node-1:
    build: .
    container_name: node-1
    hostname: node-1
    privileged: true
    # systemd ожидает эти tmpfs и cgroups
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    ports:
      - "2222:22"
    tty: true
    stop_signal: SIGRTMIN+3

  node-2:
    build: .
    container_name: node-2
    hostname: node-2
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    ports:
      - "2223:22"
    tty: true
    stop_signal: SIGRTMIN+3

  node-3:
    build: .
    container_name: node-3
    hostname: node-3
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    ports:
      - "2224:22"
    tty: true
    stop_signal: SIGRTMIN+3
